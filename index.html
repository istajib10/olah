<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ritma Care Link - Layanan Kesehatan Mahasantri</title>

    <script>
        window.tailwind = {
            darkMode: 'class',
            theme: {
                extend: {
                    screens: { 'xs': '380px' },
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                        }
                    }
                }
            }
        };
    </script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Times+New+Roman&display=swap" rel="stylesheet">

    <style>
        * { -webkit-tap-highlight-color: transparent; }
        html, body {
            overflow-x: hidden;
            touch-action: manipulation;
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .custom-scrollbar { -webkit-overflow-scrolling: touch; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .chart-container {
            position: relative;
            width: 100%;
            height: 220px;
            max-height: 260px;
        }
        @media (min-width: 640px) {
            .chart-container { height: 260px; }
        }

        input, select, textarea {
            font-size: 16px !important;
        }
        @media (min-width: 640px) {
            input, select, textarea {
                font-size: 0.875rem !important;
            }
        }

        .font-official {
            font-family: 'Times New Roman', Times, serif;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased selection:bg-teal-500 selection:text-white dark:bg-slate-900 dark:text-slate-100">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Kosongkan atau ganti dengan URL Web App Apps Script Anda
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxYcCkO3rg25UvWabFHkML7KX5neNFnMlX4rWc89d1ceDjQwB9SVuTX4T3XcODJCcrO/exec"; 

        const getSectorByBuilding = (buildingName) => {
            if (buildingName === "Gedung C") return "Putri";
            return "Putra";
        };

        const INITIAL_ROOMS = [];
        const INITIAL_SEBAT = [];
        const INITIAL_STAFF = [];
        const INITIAL_REQUESTS = [];

        function App() {
            const [currentView, setCurrentView] = useState("dashboard");
            const [userRole, setUserRole] = useState(null);
            const [currentMahasantri, setCurrentMahasantri] = useState(null);
            const [isDarkMode, setIsDarkMode] = useState(() => {
                const saved = localStorage.getItem('ritma_dark_mode');
                return saved ? JSON.parse(saved) : false;
            });
            const [isDrawerOpen, setIsDrawerOpen] = useState(false);
            const [isSyncing, setIsSyncing] = useState(false);

            const [rooms, setRooms] = useState(() => {
                const saved = localStorage.getItem('ritma_rooms_26_27');
                return saved ? JSON.parse(saved) : INITIAL_ROOMS;
            });

            const [medicines, setMedicines] = useState(() => {
                const saved = localStorage.getItem('ritma_medicines_26_27');
                return saved ? JSON.parse(saved) : INITIAL_SEBAT;
            });

            const [staff, setStaff] = useState(() => {
                const saved = localStorage.getItem('ritma_staff_26_27');
                return saved ? JSON.parse(saved) : INITIAL_STAFF;
            });

            const [requests, setRequests] = useState(() => {
                const saved = localStorage.getItem('ritma_requests_26_27');
                return saved ? JSON.parse(saved) : INITIAL_REQUESTS;
            });

            const [toast, setToast] = useState(null);
            const [confirmModal, setConfirmModal] = useState(null);

            useEffect(() => {
                localStorage.setItem('ritma_rooms_26_27', JSON.stringify(rooms));
            }, [rooms]);

            useEffect(() => {
                localStorage.setItem('ritma_medicines_26_27', JSON.stringify(medicines));
            }, [medicines]);

            useEffect(() => {
                localStorage.setItem('ritma_staff_26_27', JSON.stringify(staff));
            }, [staff]);

            useEffect(() => {
                localStorage.setItem('ritma_requests_26_27', JSON.stringify(requests));
            }, [requests]);

            useEffect(() => {
                localStorage.setItem('ritma_dark_mode', JSON.stringify(isDarkMode));
                if (isDarkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }, [isDarkMode]);

            useEffect(() => {
                syncWithGoogleSheets();
            }, []);

            const postToSheets = (action, payloadExtra = {}) => {
                const targetUrl = GOOGLE_SCRIPT_URL || window.location.href;
                const bodyData = JSON.stringify({ action: action, ...payloadExtra });

                fetch(targetUrl, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: bodyData
                }).catch(err => console.log("Background sync error:", err));
            };

            const toggleDarkMode = () => {
                setIsDarkMode(prev => {
                    const nextMode = !prev;
                    if (nextMode) {
                        document.documentElement.classList.add('dark');
                    } else {
                        document.documentElement.classList.remove('dark');
                    }
                    localStorage.setItem('ritma_dark_mode', JSON.stringify(nextMode));
                    return nextMode;
                });
                showToast(`Mode ${!isDarkMode ? 'Gelap' : 'Terang'} Diaktifkan`, "info");
            };

            const showToast = (message, type = "success") => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3500);
            };

            const syncWithGoogleSheets = async () => {
                setIsSyncing(true);
                const targetUrl = GOOGLE_SCRIPT_URL || window.location.href;

                try {
                    const response = await fetch(`${targetUrl.split('?')[0]}?action=getAllData`, { method: "GET" });
                    const result = await response.json();
                    
                    if (result && result.status === "success") {
                        if (result.mahasantri && Array.isArray(result.mahasantri)) {
                            const roomMap = {};
                            result.mahasantri.forEach(item => {
                                const bld = item.Gedung || "Gedung B";
                                const rm = String(item.No_Kamar || "101");
                                const key = `${bld}-${rm}`;
                                if (!roomMap[key]) {
                                    roomMap[key] = {
                                        id: `RM-${bld.replace("Gedung ", "")}${rm}`,
                                        building: bld,
                                        roomNo: rm,
                                        sector: item.Sektor || (bld === "Gedung C" ? "Putri" : "Putra"),
                                        occupants: []
                                    };
                                }
                                roomMap[key].occupants.push({
                                    id: item.ID || `MHS-${Math.floor(1000 + Math.random() * 9000)}`,
                                    nim: String(item.NIM || ""),
                                    name: item.Nama || "Mahasantri",
                                    fullName: item.Nama || "Mahasantri",
                                    major: item.Jurusan || "-",
                                    semester: item.Semester || "Semester 1",
                                    status: item.Status || "Sehat",
                                    symptom: item.Keluhan || "-"
                                });
                            });
                            setRooms(Object.values(roomMap));
                        }

                        if (result.obat && Array.isArray(result.obat)) {
                            setMedicines(result.obat.map(m => ({
                                id: m.Kode || `OBT-${Math.floor(100 + Math.random() * 900)}`,
                                name: m.Nama_Obat || "-",
                                category: m.Kategori || "Apotek Putra",
                                form: m.Satuan || "Tablet",
                                stock: parseInt(m.Stok, 10) || 0,
                                desc: m.Deskripsi || "",
                                expiryDate: m.Exp_Date || ""
                            })));
                        }

                        if (result.permintaan && Array.isArray(result.permintaan)) {
                            setRequests(result.permintaan.map(r => ({
                                id: r.ID_Order || `REQ-${Math.floor(100 + Math.random() * 900)}`,
                                nim: String(r.NIM || ""),
                                name: r.Nama || "",
                                building: r.Gedung || "",
                                roomNo: String(r.No_Kamar || ""),
                                sector: r.Sektor || "",
                                medicineName: r.Obat || "",
                                qty: parseInt(r.Jumlah, 10) || 1,
                                symptom: r.Keluhan || "-",
                                date: r.Tanggal || "",
                                status: r.Status || "Menunggu"
                            })));
                        }

                        if (result.petugas && Array.isArray(result.petugas)) {
                            setStaff(result.petugas.map(s => ({
                                id: s.ID || `STF-${Math.floor(100 + Math.random() * 900)}`,
                                name: s.Nama || "",
                                role: s.Role || "Anggota ORKES",
                                shift: s.Shift || "Shift Pagi",
                                sector: s.Sektor || "Putra",
                                phone: s.No_HP || "-",
                                status: s.Status_Jaga || "Bertugas",
                                avatarBg: s.Sektor === "Putri" ? "bg-pink-600" : "bg-teal-600"
                            })));
                        }

                        showToast("Data disinkronkan dari Google Sheets!", "success");
                    }
                } catch (err) {
                    console.log("Sync status:", err);
                } finally {
                    setIsSyncing(false);
                }
            };

            const handleNimLogin = (nim, guestName) => {
                let found = null;
                rooms.forEach(r => {
                    r.occupants.forEach(m => {
                        if (m.nim.trim().toLowerCase() === nim.trim().toLowerCase()) {
                            found = { ...m, building: r.building, roomNo: r.roomNo, sector: r.sector, fullName: m.fullName || m.name };
                        }
                    });
                });

                if (!found) {
                    found = {
                        id: `MHS-${Math.floor(1000 + Math.random() * 9000)}`,
                        nim: nim.trim(),
                        name: guestName.trim() || `Mahasantri (${nim})`,
                        fullName: guestName.trim() || `Mahasantri (${nim})`,
                        building: "Gedung B",
                        roomNo: "101",
                        sector: "Putra",
                        major: "Mahasantri Ma'had",
                        semester: "Semester 1",
                        status: "Sehat",
                        symptom: "-"
                    };
                }

                setCurrentMahasantri(found);
                setUserRole("mahasantri");

                postToSheets('saveMahasantri', {
                    payload: {
                        ID: found.id,
                        NIM: found.nim,
                        Nama: found.fullName,
                        Gedung: found.building,
                        No_Kamar: found.roomNo,
                        Status: found.status,
                        Sektor: found.sector,
                        Terakhir_Update: new Date().toISOString().split('T')[0]
                    }
                });

                showToast(`Selamat datang, ${found.fullName}!`, "success");
            };

            const handleRegisterMahasantri = (data) => {
                const newMhs = {
                    id: `MHS-${Math.floor(1000 + Math.random() * 9000)}`,
                    nim: data.nim,
                    name: data.fullName,
                    fullName: data.fullName,
                    major: data.major,
                    semester: data.semester,
                    status: data.status,
                    symptom: data.symptom,
                    building: data.building,
                    roomNo: data.roomNo,
                    sector: data.sector
                };

                setRooms(prevRooms => {
                    let roomExists = false;
                    const updated = prevRooms.map(r => {
                        if (r.building === data.building && r.roomNo === data.roomNo) {
                            roomExists = true;
                            return { ...r, occupants: [...r.occupants, newMhs] };
                        }
                        return r;
                    });

                    if (!roomExists) {
                        updated.push({
                            id: `RM-${data.building.replace("Gedung ", "")}${data.roomNo}`,
                            building: data.building,
                            roomNo: data.roomNo,
                            sector: data.sector,
                            occupants: [newMhs]
                        });
                    }
                    return updated;
                });

                setCurrentMahasantri(newMhs);
                setUserRole("mahasantri");

                postToSheets('saveMahasantri', {
                    payload: {
                        ID: newMhs.id,
                        NIM: newMhs.nim,
                        Nama: newMhs.fullName,
                        Gedung: newMhs.building,
                        No_Kamar: newMhs.roomNo,
                        Status: newMhs.status,
                        Sektor: newMhs.sector,
                        Terakhir_Update: new Date().toISOString().split('T')[0]
                    }
                });

                showToast("Pendaftaran berhasil tersimpan!");
            };

            const handleAdminLogin = (password) => {
                if (password === "orkes2026") {
                    setUserRole("admin");
                    showToast("Login Admin Berhasil!", "success");
                    return true;
                }
                return false;
            };

            const handleLogout = () => {
                setUserRole(null);
                setCurrentMahasantri(null);
                setCurrentView("dashboard");
                showToast("Anda telah keluar dari sistem.", "info");
            };

            const handleResetAllToHealthy = () => {
                setRooms(prev => prev.map(r => ({
                    ...r,
                    occupants: r.occupants.map(o => ({ ...o, status: "Sehat", symptom: "-" }))
                })));
                postToSheets('resetAllHealthy');
                showToast("Seluruh status mahasantri disetel SEHAT!", "success");
            };

            const handleEditMahasantri = (mhsId, roomId, updatedMhsData, building, roomNo, sector) => {
                setRooms(prev => prev.map(r => {
                    if (r.id === roomId) {
                        return {
                            ...r,
                            occupants: r.occupants.map(o => o.id === mhsId ? { ...o, ...updatedMhsData } : o)
                        };
                    }
                    return r;
                }));

                postToSheets('saveMahasantri', {
                    payload: {
                        ID: mhsId,
                        NIM: updatedMhsData.nim,
                        Nama: updatedMhsData.fullName || updatedMhsData.name,
                        Gedung: building,
                        No_Kamar: roomNo,
                        Status: updatedMhsData.status,
                        Sektor: sector,
                        Terakhir_Update: new Date().toISOString().split('T')[0]
                    }
                });

                showToast("Data mahasantri diperbarui!");
            };

            const handleDeleteMahasantri = (roomId, mhsId, mhsName, nim) => {
                setRooms(prev => prev.map(r => {
                    if (r.id === roomId) {
                        return { ...r, occupants: r.occupants.filter(o => o.id !== mhsId) };
                    }
                    return r;
                }));

                postToSheets('deleteRow', {
                    sheetName: 'Mahasantri_Kamar',
                    keyColumn: 'NIM',
                    keyValue: nim
                });

                showToast(`Mahasantri ${mhsName} berhasil dihapus.`);
            };

            const handleAddMedicine = (newMed) => {
                setMedicines([...medicines, newMed]);
                postToSheets('saveObat', {
                    payload: {
                        Kode: newMed.id,
                        Nama_Obat: newMed.name,
                        Sektor: newMed.category.includes("Putri") ? "Putri" : "Putra",
                        Kategori: newMed.category,
                        Stok: newMed.stock,
                        Satuan: newMed.form,
                        Deskripsi: newMed.desc,
                        Exp_Date: newMed.expiryDate
                    }
                });
                showToast(`Obat ${newMed.name} tersimpan!`);
            };

            const handleEditMedicine = (updatedMed) => {
                setMedicines(prev => prev.map(m => m.id === updatedMed.id ? updatedMed : m));
                postToSheets('saveObat', {
                    payload: {
                        Kode: updatedMed.id,
                        Nama_Obat: updatedMed.name,
                        Sektor: updatedMed.category.includes("Putri") ? "Putri" : "Putra",
                        Kategori: updatedMed.category,
                        Stok: updatedMed.stock,
                        Satuan: updatedMed.form,
                        Deskripsi: updatedMed.desc,
                        Exp_Date: updatedMed.expiryDate
                    }
                });
                showToast(`Data obat ${updatedMed.name} diperbarui!`);
            };

            const handleDeleteMedicine = (medId, medName) => {
                setMedicines(prev => prev.filter(m => m.id !== medId));
                postToSheets('deleteRow', {
                    sheetName: 'Stok_Obat',
                    keyColumn: 'Kode',
                    keyValue: medId
                });
                showToast(`Obat ${medName} berhasil dihapus.`);
            };

            const handleAddStaff = (newStaff) => {
                setStaff([...staff, newStaff]);
                postToSheets('savePetugas', {
                    payload: {
                        ID: newStaff.id,
                        Nama: newStaff.name,
                        Role: newStaff.role,
                        No_HP: newStaff.phone,
                        Shift: newStaff.shift,
                        Sektor: newStaff.sector,
                        Status_Jaga: newStaff.status
                    }
                });
                showToast(`Petugas ${newStaff.name} tersimpan!`);
            };

            const handleEditStaff = (updatedStaff) => {
                setStaff(prev => prev.map(s => s.id === updatedStaff.id ? updatedStaff : s));
                postToSheets('savePetugas', {
                    payload: {
                        ID: updatedStaff.id,
                        Nama: updatedStaff.name,
                        Role: updatedStaff.role,
                        No_HP: updatedStaff.phone,
                        Shift: updatedStaff.shift,
                        Sektor: updatedStaff.sector,
                        Status_Jaga: updatedStaff.status
                    }
                });
                showToast(`Data petugas ${updatedStaff.name} diperbarui!`);
            };

            const handleDeleteStaff = (staffId, staffName) => {
                setStaff(prev => prev.filter(s => s.id !== staffId));
                postToSheets('deleteRow', {
                    sheetName: 'Petugas_ORKES',
                    keyColumn: 'ID',
                    keyValue: staffId
                });
                showToast(`Petugas ${staffName} berhasil dihapus.`);
            };

            const handleRequestMedicine = (medName, qty, symptom) => {
                if (!currentMahasantri) return;
                const newReq = {
                    id: `REQ-${Math.floor(100 + Math.random() * 900)}`,
                    nim: currentMahasantri.nim,
                    name: currentMahasantri.fullName || currentMahasantri.name,
                    building: currentMahasantri.building,
                    roomNo: currentMahasantri.roomNo,
                    sector: currentMahasantri.sector,
                    medicineName: medName,
                    qty: parseInt(qty, 10) || 1,
                    symptom: symptom || "Keluhan kesehatan mahasantri",
                    date: new Date().toLocaleDateString('id-ID'),
                    status: "Menunggu"
                };
                
                setRequests([newReq, ...requests]);

                postToSheets('savePermintaan', {
                    payload: {
                        ID_Order: newReq.id,
                        Tanggal: newReq.date,
                        NIM: newReq.nim,
                        Nama: newReq.name,
                        Gedung: newReq.building,
                        No_Kamar: newReq.roomNo,
                        Obat: newReq.medicineName,
                        Jumlah: newReq.qty,
                        Keluhan: newReq.symptom,
                        Status: newReq.status,
                        Sektor: newReq.sector
                    }
                });

                showToast(`Permintaan obat terkirim & tersimpan ke Sheets!`, "success");
            };

            const handleUpdateRequestStatus = (reqId, newStatus) => {
                const reqItem = requests.find(r => r.id === reqId);
                if (!reqItem) return;

                if (newStatus === "Disetujui") {
                    setMedicines(prevMeds => prevMeds.map(m => {
                        if (m.name.toLowerCase().trim() === reqItem.medicineName.toLowerCase().trim() && m.stock >= reqItem.qty) {
                            return { ...m, stock: m.stock - reqItem.qty };
                        }
                        return m;
                    }));
                }

                setRequests(prev => prev.map(r => r.id === reqId ? { ...r, status: newStatus } : r));

                postToSheets('savePermintaan', {
                    payload: {
                        ID_Order: reqItem.id,
                        Tanggal: reqItem.date,
                        NIM: reqItem.nim,
                        Nama: reqItem.name,
                        Gedung: reqItem.building,
                        No_Kamar: reqItem.roomNo,
                        Obat: reqItem.medicineName,
                        Jumlah: reqItem.qty,
                        Keluhan: reqItem.symptom,
                        Status: newStatus,
                        Sektor: reqItem.sector
                    }
                });

                showToast(`Status permintaan ${reqId} diperbarui menjadi ${newStatus}`);
            };

            const handleDeleteRequest = (reqId) => {
                setRequests(prev => prev.filter(r => r.id !== reqId));
                postToSheets('deleteRow', {
                    sheetName: 'Permintaan_Obat',
                    keyColumn: 'ID_Order',
                    keyValue: reqId
                });
                showToast(`Permintaan ${reqId} berhasil dihapus.`);
            };

            if (!userRole) {
                return <AuthContainer 
                            onNimLogin={handleNimLogin}
                            onRegisterMahasantri={handleRegisterMahasantri} 
                            onAdminLogin={handleAdminLogin} 
                            isDarkMode={isDarkMode} 
                            toggleDarkMode={toggleDarkMode} 
                       />;
            }

            if (userRole === "mahasantri") {
                return (
                    <UserPortalLayout 
                        mahasantri={currentMahasantri} 
                        medicines={medicines} 
                        staff={staff} 
                        requests={requests.filter(r => String(r.nim).trim() === String(currentMahasantri.nim).trim())} 
                        onRequestMedicine={handleRequestMedicine}
                        onLogout={handleLogout}
                        isDarkMode={isDarkMode}
                        toggleDarkMode={toggleDarkMode}
                        toast={toast}
                    />
                );
            }

            return (
                <div className={`min-h-screen flex flex-col pb-20 md:pb-0 transition-colors duration-200 ${isDarkMode ? 'bg-slate-900 text-slate-100' : 'bg-slate-50 text-slate-800'}`}>
                    <header className={`sticky top-0 z-30 shadow-sm border-b transition-colors duration-200 ${isDarkMode ? 'bg-slate-800/95 border-slate-700 backdrop-blur-md' : 'bg-white/95 border-slate-200 backdrop-blur-md'}`}>
                        <div className="max-w-7xl mx-auto px-3 sm:px-4 py-2.5 sm:py-3 flex justify-between items-center">
                            <div className="flex items-center gap-2.5 sm:gap-3">
                                <button 
                                    onClick={() => setIsDrawerOpen(true)}
                                    className={`w-10 h-10 rounded-xl flex items-center justify-center transition active:scale-95 ${isDarkMode ? 'text-slate-300 hover:bg-slate-700 bg-slate-800' : 'text-slate-600 hover:bg-slate-100 bg-slate-50'}`}
                                    aria-label="Buka Menu Sidebar"
                                    title="Menu">
                                    <i className="fa-solid fa-bars text-lg"></i>
                                </button>
                                <div className="flex items-center gap-2">
                                    <div className="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-teal-600 flex items-center justify-center text-white shadow-sm font-bold text-sm">
                                        <i className="fa-solid fa-user-gear"></i>
                                    </div>
                                    <div className="leading-tight">
                                        <div className="flex items-center gap-1.5">
                                            <h1 className="font-bold text-sm sm:text-base">Ritma Care</h1>
                                            <span className="text-[10px] font-extrabold px-1.5 py-0.5 rounded bg-teal-500/20 text-teal-500 border border-teal-500/30">ADMIN</span>
                                        </div>
                                        <p className="text-[10px] sm:text-[11px] text-teal-600 dark:text-teal-400 font-semibold truncate max-w-[170px] xs:max-w-none">Gedung B, C & D (2026/2027)</p>
                                    </div>
                                </div>
                            </div>

                            <div className="flex items-center gap-1.5 sm:gap-2.5">
                                <button 
                                    onClick={() => syncWithGoogleSheets()}
                                    disabled={isSyncing}

            const chartBuildingRef = useRef(null);

            const [stockSector, setStockSector] = useState("Putra");

            let bldSick = { "Gedung B": 0, "Gedung C": 0, "Gedung D": 0 };
            let totalSick = 0;
            let totalMahasantri = 0;

            rooms.forEach(r => {
                const bName = r.building in bldSick ? r.building : "Gedung B";
                r.occupants.forEach(mhs => {
                    totalMahasantri++;
                    if (mhs.status !== "Sehat") {
                        bldSick[bName]++;
                        totalSick++;
                    }
                });
            });

            const bldBPercent = totalSick > 0 ? Math.round((bldSick["Gedung B"] / totalSick) * 100) : 0;
            const bldCPercent = totalSick > 0 ? Math.round((bldSick["Gedung C"] / totalSick) * 100) : 0;
            const bldDPercent = totalSick > 0 ? Math.round((bldSick["Gedung D"] / totalSick) * 100) : 0;

            useEffect(() => {
                if (!window.Chart) return;

                let buildingChartInstance = null;
                let stockChartInstance = null;

                const labelColor = isDarkMode ? '#cbd5e1' : '#334155';
                const gridColor = isDarkMode ? '#334155' : '#e2e8f0';

                if (chartBuildingRef.current) {
                    const ctxB = chartBuildingRef.current.getContext('2d');
                    buildingChartInstance = new window.Chart(ctxB, {
                        type: 'doughnut',
                        data: {
                            labels: [`Gedung B (${bldBPercent}%)`, `Gedung C (${bldCPercent}%)`, `Gedung D (${bldDPercent}%)`],
                            datasets: [{
                                data: [bldSick["Gedung B"], bldSick["Gedung C"], bldSick["Gedung D"]],
                                backgroundColor: ['#0d9488', '#ec4899', '#6366f1'],
                                borderWidth: 3,
                                borderColor: isDarkMode ? '#1e293b' : '#ffffff'

                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            cutout: '68%',
                            plugins: {
                                legend: {
                                    position: 'bottom',
                                    labels: { color: labelColor, font: { size: 11, weight: 'bold' } }
                                }
                            }
                        }
                    });
                }

                if (chartStockRef.current) {
                    const ctxStock = chartStockRef.current.getContext('2d');
                    const targetCategory = stockSector === "Putra" ? "Apotek Putra" : "Apotek Putri";
                    const filteredMeds = medicines.filter(m => m.category === targetCategory);

                            maintainAspectRatio: false,
                            plugins: { legend: { display: false } },
                            scales: {
                                y: { ticks: { color: labelColor }, grid: { color: gridColor }, beginAtZero: true },
                                x: { ticks: { color: labelColor }, grid: { display: false } }
                            }
                        }
                    });
                }

                return () => {
                    if (buildingChartInstance) buildingChartInstance.destroy();

                                        <td className="p-3 font-bold">{req.name} ({req.nim})</td>
                                        <td className="p-3 font-bold text-emerald-500">{req.medicineName} x{req.qty}</td>
                                        <td className="p-3">{req.symptom}</td>
                                        <td className="p-3 font-bold">{req.status}</td>
                                        <td className="p-3 text-center">
                                            {req.status === 'Menunggu' && (
                                                <div className="flex justify-center gap-1">
                                                    <button onClick={() => onUpdateRequestStatus(req.id, "Disetujui")} className="px-2 py-1 bg-emerald-600 hover:bg-emerald-700 text-white rounded font-bold">Setujui</button>
                                                    <button onClick={() => onUpdateRequestStatus(req.id, "Ditolak")} className="px-2 py-1 bg-red-600 hover:bg-red-700 text-white rounded font-bold">Tolak</button>
                                                </div>
                                            )}
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        function CekmarView({ rooms, onEditMahasantri, onDeleteMahasantri, onResetAllToHealthy, setConfirmModal, isDarkMode }) {
            return (
                <div className="space-y-4">
                    <div className="flex justify-between items-center pb-2 border-b dark:border-slate-800">
                        <h2 className="text-xl font-black">Data Kamar & Mahasantri (Cekmar)</h2>
                        <button onClick={() => setConfirmModal({ title: "Reset Status", message: "Setel semua mahasantri menjadi SEHAT?", onConfirm: onResetAllToHealthy })} className="px-3.5 py-2 bg-emerald-600 text-white font-bold rounded-xl text-xs">
                            Setel Semua Sehat
                        </button>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        {rooms.map(room => (
                            <div key={room.id} className={`p-4 rounded-3xl border ${isDarkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-200'}`}>
                                <h3 className="font-bold text-sm border-b pb-2">{room.building} - Kamar {room.roomNo}</h3>
                                <div className="space-y-2 mt-2">
                                    {room.occupants.map(mhs => (
                                        <div key={mhs.id} className="flex justify-between items-center text-xs p-2.5 rounded-xl border dark:border-slate-700">
                                            <div>
                                                <div className="font-bold">{mhs.fullName || mhs.name}</div>
                                                <div className="text-[10px] text-slate-400">{mhs.nim} · {mhs.major}</div>
                                            </div>
                                            <span className="px-2 py-0.5 rounded-full font-extrabold bg-emerald-500/20 text-emerald-400">{mhs.status}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function SebatView({ medicines, onAddMedicine, onEditMedicine, onDeleteMedicine, setConfirmModal, isDarkMode }) {
            const [showAdd, setShowAdd] = useState(false);
            const [name, setName] = useState("");
            const [stock, setStock] = useState(10);
            const [category, setCategory] = useState("Apotek Putra");

            const handleAdd = (e) => {
                e.preventDefault();
                onAddMedicine({
                    id: `OBT-${Math.floor(100 + Math.random() * 900)}`,
                    name,
                    category,
                    form: "Tablet",
                    stock: parseInt(stock, 10) || 0,
                    desc: "Sediaan Obat Poskes Ma'had",
                    expiryDate: "2027-12-31"
                });
                setShowAdd(false);
                setName("");
            };

            return (
                <div className="space-y-4">
                    <div className="flex justify-between items-center pb-2 border-b dark:border-slate-800">
                        <h2 className="text-xl font-black">Stok Sediaan Obat (Sebat)</h2>
                        <button onClick={() => setShowAdd(true)} className="px-3.5 py-2 bg-teal-600 text-white font-bold rounded-xl text-xs">
                            + Tambah Obat
                        </button>
                    </div>
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        {medicines.map(med => (
                            <div key={med.id} className={`p-4 rounded-2xl border ${isDarkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-200'}`}>
                                <span className="text-[9px] font-bold px-2 py-0.5 rounded bg-teal-500/10 text-teal-500">{med.category}</span>
                                <h4 className="font-bold text-sm mt-1">{med.name}</h4>
                                <p className="text-xs text-emerald-500 font-bold mt-2">Stok: {med.stock} {med.form}</p>
                            </div>
                        ))}
                    </div>
                    {showAdd && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
                            <div className="fixed inset-0 bg-slate-950/70" onClick={() => setShowAdd(false)}></div>
                            <div className={`relative w-full max-w-md p-6 rounded-3xl z-10 space-y-3 ${isDarkMode ? 'bg-slate-800 text-white' : 'bg-white text-slate-800'}`}>
                                <h3 className="font-bold text-base">Tambah Obat Baru</h3>
                                <form onSubmit={handleAdd} className="space-y-3 text-xs">
                                    <input type="text" placeholder="Nama Obat" value={name} onChange={(e) => setName(e.target.value)} required className={`w-full p-2.5 border rounded-xl ${isDarkMode ? 'bg-slate-900 border-slate-700' : 'bg-white'}`} />
                                    <select value={category} onChange={(e) => setCategory(e.target.value)} className={`w-full p-2.5 border rounded-xl ${isDarkMode ? 'bg-slate-900 border-slate-700' : 'bg-white'}`}>
                                        <option value="Apotek Putra">Apotek Putra</option>
                                        <option value="Apotek Putri">Apotek Putri</option>
                                    </select>
                                    <input type="number" placeholder="Stok" value={stock} onChange={(e) => setStock(e.target.value)} required className={`w-full p-2.5 border rounded-xl ${isDarkMode ? 'bg-slate-900 border-slate-700' : 'bg-white'}`} />
                                    <div className="flex gap-2">
                                        <button type="button" onClick={() => setShowAdd(false)} className="flex-1 py-2 border rounded-xl">Batal</button>
                                        <button type="submit" className="flex-1 py-2 bg-teal-600 text-white rounded-xl font-bold">Simpan</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function ReportsView({ rooms, requests, isDarkMode }) {
            return (
                <div className="p-8 bg-white text-slate-900 rounded-3xl border border-slate-300 shadow-xl space-y-6 font-official max-w-4xl mx-auto">
                    <div className="border-b-4 border-double border-slate-900 pb-3 text-center">
                        <h1 className="text-base font-black tracking-wider uppercase">MA'HAD TAHFIZH AL-QURAN UIN SUNAN GUNUNG DJATI BANDUNG</h1>
                        <h2 className="text-sm font-bold text-teal-800 uppercase">DEPARTEMEN OLAHRAGA DAN KESEHATAN (ORKES)</h2>
                        <p className="text-xs">Jl. A.H. Nasution No. 105, Cibiru, Kota Bandung · WA Admin: +62 857-7609-1473</p>
                    </div>
                    <div className="text-center">
                        <h3 className="text-base font-bold underline uppercase">LAPORAN REKAPITULASI KESEHATAN MAHASANTRI</h3>
                    </div>
                    <div className="text-xs space-y-2">
                        <p><strong>Total Mahasantri:</strong> {rooms.reduce((acc, r) => acc + r.occupants.length, 0)} Santri</p>
                        <p><strong>Jumlah Permintaan Obat:</strong> {requests.length} Permintaan</p>
                    </div>
                </div>
            );
        }

        function StaffView({ staff, isDarkMode }) {
            return (
                <div className="space-y-4">
                    <h2 className="text-xl font-black">Tim Kesehatan & ORKES</h2>
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        {staff.map(st => (
                            <div key={st.id} className={`p-4 rounded-2xl border ${isDarkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-200'}`}>
                                <h4 className="font-bold text-sm">{st.name}</h4>
                                <p className="text-xs text-teal-500 font-bold">{st.role} - {st.shift}</p>
                                <p className="text-[11px] text-slate-400 mt-1"><i className="fa-solid fa-phone me-1"></i>{st.phone}</p>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
